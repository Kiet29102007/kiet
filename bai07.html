
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xúc xắc may mắn</title>
</head>
<body>
    <h2> Xúc xắc may mắn</h2>

    <button onclick="lacXucXac()">Lắc xúc xắc</button>

    <h3 id="ketQua"></h3>

    <script>
        function lacXucXac() {
            let so = Math.floor(Math.random() * 6) + 1;

            document.getElementById("ketQua").innerHTML =
                "Kết quả xúc xắc: " + so;
        }
    </script>
</body>
</html>
