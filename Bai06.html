
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trò chơi Oẳn tù tì</title>
</head>
<body>
    <h2> Trò chơi Oẳn tù tì</h2>

    <p>Hãy chọn một trong ba lựa chọn:</p>

    <button onclick="choi('Đá')">Đá</button>
    <button onclick="choi('Giấy')"> Giấy</button>
    <button onclick="choi('Kéo')"> Kéo</button>

    <h3 id="ketQua"></h3>

    <script>
        function choi(nguoiChoi) {
            let luaChon = ["Đá", "Giấy", "Kéo"];

            let mayChoi = luaChon[
                Math.floor(Math.random() * 3)
            ];

            let ketQua = "";

            if (nguoiChoi == mayChoi) {
                ketQua = "Hòa!";
            } else if (
                (nguoiChoi == "Đá" && mayChoi == "Kéo") ||
                (nguoiChoi == "Giấy" && mayChoi == "Đá") ||
                (nguoiChoi == "Kéo" && mayChoi == "Giấy")
            ) {
                ketQua = "Bạn thắng! ";
            } else {
                ketQua = "Bạn thua! ";
            }

            document.getElementById("ketQua").innerHTML =
                "Bạn chọn: " + nguoiChoi + "<br>" +
                "Máy chọn: " + mayChoi + "<br>" +
                "Kết quả: " + ketQua;
        }
    </script>
</body>
</html>
