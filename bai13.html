
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển đổi nhiệt độ</title>
</head>
<body>
    <h2>Chuyển đổi nhiệt độ</h2>
    <label for="celsius">Nhập nhiệt độ theo °C:</label>
    <input type="number" id="celsius" placeholder="Nhập độ C">
    <button onclick="chuyenDoi()">Chuyển đổi</button>
    <p id="ketqua"></p>
    <script>
        function chuyenDoi() {
            let c = document.getElementById("celsius").value;
            if (c === "") {
                alert("Vui lòng nhập nhiệt độ °C!");
                return;
            }
            c = Number(c);
            let f = (9 / 5) * c + 32;
            document.getElementById("ketqua").innerHTML =
                "Nhiệt độ sau khi chuyển đổi: " + f + " °F";
        }
    </script>
</body>
</html>
