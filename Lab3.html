
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 20px;
        }

        .container {
            width: 560px;
            padding: 15px;
        }

        h2 {
            font-size: 30px;
            margin-top: 0;
        }

        .row {
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 250px;
            height: 30px;
            font-size: 18px;
            box-sizing: border-box;
        }

        input[type="number"] {
            width: 260px;
            height: 38px;
            font-size: 18px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }

        select {
            width: 255px;
            height: 38px;
            font-size: 18px;
        }

        textarea {
            width: 455px;
            height: 170px;
            font-size: 18px;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            font-size: 18px;
            padding: 5px 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Registration Form</h2>

        <form>
            <div class="row">
                First Name :
                <input type="text" placeholder="Enter First Name">
            </div>

            <div class="row">
                Last Name :
                <input type="text" placeholder="Enter Last Name">
            </div>

            <div class="row">
                Email :
                <input type="email" placeholder="Enter Email Address">
            </div>

            <div class="row">
                Password :
                <input type="password">
            </div>

            <div class="row">
                Gender:<br>
                Male <input type="radio" name="gender">
                <br>
                Female <input type="radio" name="gender">
                <br>
                Other <input type="radio" name="gender">
            </div>

            <div class="row">
                Age :
                <input type="number" min="1" max="120">
            </div>

            <div class="row">
                Preferences :<br>
                Acrylic Painting
                <input type="checkbox">
                <br>

                Oil Painting
                <input type="checkbox">
                <br>

                Water Color Painting
                <input type="checkbox">
            </div>

            <div class="row">
                Select Occupation
                <select>
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>Employee</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="row">
                Bio
                <textarea placeholder="Share few lines about yourself..."></textarea>
            </div>

            <button type="reset">RESET</button>
            <button type="submit">SUBMIT</button>
        </form>
    </div>
</body>
</html>
