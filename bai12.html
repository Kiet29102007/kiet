
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra năm nhuận</title>
</head>
<body>
    <h2>Kiểm tra năm nhuận</h2>

    <label>Nhập năm:</label>
    <input type="number" id="nam">

    <button onclick="kiemTra()">Kiểm tra</button>

    <p id="ketQua"></p>

    <script>
        function kiemTra() {
            let nam = Number(document.getElementById("nam").value);

            if (nam <= 0 || document.getElementById("nam").value === "" ||
                !Number.isInteger(nam)) {
                document.getElementById("ketQua").innerHTML =
                    "Vui lòng nhập một năm hợp lệ!";
            } else if (nam % 400 == 0 ||
                       (nam % 4 == 0 && nam % 100 != 0)) {
                document.getElementById("ketQua").innerHTML =
                    nam + " là năm nhuận.";
            } else {
                document.getElementById("ketQua").innerHTML =
                    nam + " không phải là năm nhuận.";
            }
        }
    </script>
</body>
</html>
