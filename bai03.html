
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xếp loại học lực</title>
</head>
<body>
    <h2>Xếp loại học lực</h2>

    <label>Nhập điểm (0 - 100):</label>
    <input type="number" id="diem" min="0" max="100">

    <button onclick="xepLoai()">Xep loai</button>

    <p id="ketQua"></p>

    <script>
        function xepLoai() {
            let diem = Number(document.getElementById("diem").value);

            if (diem < 0 || diem > 100 ||
                document.getElementById("diem").value === "") {
                document.getElementById("ketQua").innerHTML =
                    "Vui lòng nhập điểm từ 0 đến 100!";
            } else if (diem >= 90) {
                document.getElementById("ketQua").innerHTML =
                    "Xếp loại A";
            } else if (diem >= 80) {
                document.getElementById("ketQua").innerHTML =
                    "Xếp loại B";
            } else if (diem >= 70) {
                document.getElementById("ketQua").innerHTML =
                    "Xếp loại C";
            } else if (diem >= 60) {
                document.getElementById("ketQua").innerHTML =
                    "Xếp loại D";
            } else {
                document.getElementById("ketQua").innerHTML =
                    "Xếp loại F";
            }
        }
    </script>
</body>
</html>
