
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Máy tính đơn giản</title>
</head>
<body>
    <h2>Máy tính đơn giản</h2>

    <label>Nhập số thứ nhất:</label>
    <input type="number" id="so1">
    <br><br>

    <label>Nhập số thứ hai:</label>
    <input type="number" id="so2">
    <br><br>

    <button onclick="tinhToan('+')">Cộng </button>
    <button onclick="tinhToan('-')">Trừ </button>
    <button onclick="tinhToan('*')">Nhân </button>
    <button onclick="tinhToan('/')">Chia </button>

    <h3 id="ketQua"></h3>

    <script>
        function tinhToan(phepTinh) {
            let a = document.getElementById("so1").value;
            let b = document.getElementById("so2").value;

            if (a === "" || b === "") {
                document.getElementById("ketQua").innerHTML =
                    "Vui lòng nhập đầy đủ hai số!";
                return;
            }

            a = Number(a);
            b = Number(b);

            let ketQua;

            if (phepTinh == "+") {
                ketQua = a + b;
            } else if (phepTinh == "-") {
                ketQua = a - b;
            } else if (phepTinh == "*") {
                ketQua = a * b;
            } else if (phepTinh == "/") {
                if (b == 0) {
                    document.getElementById("ketQua").innerHTML =
                        "Không thể chia cho 0!";
                    return;
                } else {
                    ketQua = a / b;
                }
            }

            document.getElementById("ketQua").innerHTML =
                "Kết quả: " + ketQua;
        }
    </script>
</body>
</html>
